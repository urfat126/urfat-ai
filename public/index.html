<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urfat AI</title>
  <style>
  header h1 {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .logo {
    width: 55px;
    height: 55px;
    object-fit: contain;
    border-radius: 50%;
  }
</style>
</head>

<body>
  <div class="app">
    <header>
      <h1>
  <img src="/urfat-ai-logo.png" alt="Urfat AI" class="logo">
  <span>Urfat AI</span>
</h1>
      <p>তোমার নিজের AI Assistant</p>
    </header>

    <main>
      <div id="chatBox" class="chat-box">
        <div class="message ai">
          হ্যালো! 👋 আমি Urfat AI। আমাকে কিছু জিজ্ঞেস করো।
        </div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="এখানে লিখো..."
          autocomplete="off"
        >

        <button id="sendButton">Send</button>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
