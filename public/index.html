<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urfat AI</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🤖 Urfat AI</h1>
      <p>তোমার নিজের AI Assistant</p>
    </header>

    <main>
      <div id="chatBox" class="chat-box">
        <div class="message ai">
          হ্যালো! 👋 আমি Urfat AI। আমাকে কিছু জিজ্ঞেস করো।
        </div>
      </div>

      <div class="input-area">
        <input id="messageInput" type="text" placeholder="এখানে লিখো...">
        <button id="sendButton">Send</button>
      </div>
    </main>
  </div>

  <script src="/public/app.js"></script>
</body>
</html>
